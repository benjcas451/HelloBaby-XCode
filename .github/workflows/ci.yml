name: Build

# Automatischer Build-Check. build-ipa.yml taugt dafür nicht: die läuft nur
# manuell und veröffentlicht am Ende ein GitHub-Release. Hier zählt allein,
# ob der Code übersetzt – deshalb ohne IPA-Verpackung und ohne Release.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Release-Build (iphoneos, unsigniert)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # Gleicher Aufruf wie in build-ipa.yml, nur ohne die Release-Schritte.
      # Ein shared scheme liegt bewusst nicht im Repo – Xcode legt es zur
      # Laufzeit selbst an; in diesem Repo-Verbund ist der Aufruf so bereits
      # erfolgreich gelaufen.
      - name: App bauen
        run: |
          xcodebuild \
            -project HelloBaby.xcodeproj \
            -scheme HelloBaby \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            -derivedDataPath DerivedData \
            build

      # Die beiden Schluessel entscheiden, ob der App-Ordner in der
      # "Dateien"-App ueberhaupt auftaucht. Sie stehen als INFOPLIST_KEY_*
      # im Projekt; ob sie dort wirklich als Boolean in der generierten
      # Info.plist landen, sieht man erst am gebauten Bundle. Deshalb hier
      # geprueft statt angenommen - ein stiller Ausfall hat schon einmal
      # eine Version gekostet.
      - name: Dateien-App-Schluessel in der Info.plist pruefen
        run: |
          set -euo pipefail
          app=""
          for kandidat in DerivedData/Build/Products/Release-iphoneos/*.app; do
            if [ -d "$kandidat" ]; then app="$kandidat"; break; fi
          done
          if [ -z "$app" ]; then
            echo "::error::Kein gebautes .app-Bundle gefunden"
            exit 1
          fi
          echo "Bundle: $app"
          fehler=0
          # UIFileSharingEnabled kommt aus AppInfo.plist,
          # LSSupportsOpeningDocumentsInPlace aus INFOPLIST_KEY_*. Dass beide
          # ankommen, belegt zugleich, dass Xcode die generierten Werte in die
          # Datei hineinmergt statt sie zu ersetzen.
          for schluessel in UIFileSharingEnabled LSSupportsOpeningDocumentsInPlace; do
            wert=$(/usr/libexec/PlistBuddy -c "Print :$schluessel" \
              "$app/Info.plist" 2>/dev/null || echo FEHLT)
            echo "$schluessel = $wert"
            if [ "$wert" != "true" ]; then
              echo "::error::$schluessel ist '$wert' statt 'true' -- der App-Ordner bleibt in der Dateien-App unsichtbar"
              fehler=1
            fi
          done
          # Zweiter, unabhaengiger Beleg fuer den Merge: die Version stammt aus
          # MARKETING_VERSION und existiert nur, wenn generiert wurde.
          version=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" \
            "$app/Info.plist" 2>/dev/null || echo FEHLT)
          echo "CFBundleShortVersionString = $version"
          if [ "$version" = "FEHLT" ] || [ -z "$version" ]; then
            echo "::error::CFBundleShortVersionString fehlt -- die generierten Info.plist-Werte kommen nicht mehr an"
            fehler=1
          fi
          exit $fehler
